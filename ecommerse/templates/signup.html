<!-- prettier-ignore -->
{% extends "base.html" %} {% block title %}Sign-up{% endblock %} 
{% block content %}

<div class="card bg-light p-3 mt-5 w-50 mx-auto">
  {% for message in messages %}
  <div
    class="alert alert-{{ message.tags }} alert-dismissible fade show"
    role="alert"
  >
    <strong>{{ message }}</strong>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="alert"
      aria-label="Close"
    ></button>
  </div>

  {% endfor %}
  <h1 class="text-dark">Sign Up</h1>
  <form action="/auth/signup/" method="post">
    {% csrf_token %}
    <label for="email">Email</label>
    <div class="form-group">
      <input
        type="email"
        class="form-control mb-3"
        id="email"
        name="email"
        required
      />
    </div>
    <label for="pass1">Password</label>
    <div class="form-group">
      <input
        type="password"
        class="form-control mb-3"
        id="pass1"
        name="pass1"
        required
      />
    </div>
    <label for="pass2">Confirm Password</label>
    <div class="form-group">
      <input
        type="password"
        class="form-control mb-3"
        id="pass2"
        name="pass2"
        required
      />
    </div>
    <button type="submit" class="btn bg-success">Sign In</button>
    <br />

    <p class="text-dark">
      Already have an account? <a href="/auth/login">Login</a>
    </p>
  </form>
</div>

{% endblock content%}
