{% extends "authentication/base.html" %} {% block title %}Log-in{% endblock %}
{% block content %}

<div class="card bg-light p-3 mt-5 w-50 mx-auto">
  {% for message in messages %}
  <div
    class="alert alert-{{ message.tags }} alert-dismissible fade show"
    role="alert"
  >
    <strong>{{ message }}</strong>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="alert"
      aria-label="Close"
    ></button>
  </div>

  {% endfor %}
  <h1 class="text-dark">Log In</h1>
  <form action="/auth/login/" method="post">
    {% csrf_token %}
    <label for="email">Email</label>
    <div class="form-group">
      <input
        type="email"
        class="form-control mb-3"
        id="email"
        name="email"
        required
      />
    </div>
    <label for="pass1">Password</label>
    <div class="form-group">
      <input
        type="password"
        class="form-control mb-3"
        id="pass1"
        name="pass1"
        required
      />
    </div>

    <button type="submit" class="btn bg-success">LogIn</button>
    <br />

    <p class="text-dark">New User? <a href="/auth/signup">Sign Up</a></p>
  </form>
</div>

{% endblock %}
